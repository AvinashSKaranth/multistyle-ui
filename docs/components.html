<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>multistyle-ui components</title>
  <link rel="stylesheet" href="./multistyle.min.css">
  <link rel="stylesheet" href="./docs.css">
  <script defer src="./multistyle.min.js"></script>
  <script defer src="./docs.js"></script>
  <script defer src="./vendor/alpine.min.js"></script>
  <script defer src="./vendor/chart.umd.min.js"></script>
  <!-- CDN demos (need network): Prism, Mermaid, Quill, Material Symbols (loaded by multistyle) -->
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
</head>
<body data-ms-persist>
<div id="app" x-data="app" @ms:change.document="tick++">

<header class="topbar" data-ms-fields="stacked">
  <div class="topbar-row">
    <span class="brand">multistyle-ui</span>
    <nav class="pages" aria-label="Pages"><a href="index.html">Guide</a><a href="components.html" aria-current="page">Components</a></nav>
    <label>Style <select data-ms="style" aria-label="Style"></select></label>
    <label>Theme
      <select data-ms="theme" aria-label="Theme" @change="$event.target.value === 'custom' && apply()"></select>
    </label>
    <label>Mode <select data-ms="mode" aria-label="Mode"></select></label>
    <label>Font <select data-ms="font" aria-label="Font"></select></label>
    <button type="button" class="sm outline" data-ms-mode-toggle>Toggle mode</button>
    <template x-if="$store.ms.theme === 'custom'">
      <span class="topbar-row" style="gap:.35rem">
        <label>Primary <input type="color" aria-label="Primary" :value="p" @input="p = $event.target.value; apply()"></label>
        <label>Secondary <input type="color" aria-label="Secondary" :value="s" @input="s = $event.target.value; apply()"></label>
        <label>Surface <input type="color" aria-label="Surface" :value="f" @input="f = $event.target.value; apply()"></label>
      </span>
    </template>
  </div>
  <div class="bodystr">
    <code id="bodystr" x-text="bodyTag()"></code>
    <button type="button" class="sm" data-copy="#bodystr">Copy</button>
  </div>
</header>

<div class="layout single">
<main>
<h1>Components</h1>
<p>One tab per component. Each example has a <strong>Preview</strong> and a <strong>Code</strong> view generated from the same source. Deep links work, e.g. <a href="#c-modal"><code>#c-modal</code></a>. Mermaid, Text editor, Code and Icons load from a CDN and need network.</p>
<section id="components">
  <div class="explorer" id="explorer">

<section role="tabpanel" id="c-typography" data-title="Typography" data-desc="Headings, text and quotes are styled with no classes.">
  <template class="example" data-title="Text elements" data-note="Classless.">
    <h1>Heading 1</h1><h2>Heading 2</h2><h3>Heading 3</h3>
    <p>Paragraph with <a href="#c-typography">a link</a>, <strong>strong</strong>, <em>em</em>, <mark>mark</mark>, <kbd>Ctrl</kbd>, <code>code</code> and <small>small text</small>.</p>
    <blockquote>A blockquote.<footer><cite>Someone</cite></footer></blockquote>
    <hr>
  </template>
</section>

<section role="tabpanel" id="c-fonts" data-title="Fonts" data-desc="MS.set({font}) with a curated list, lazy-loaded from Google Fonts">
  <template class="example" data-title="Font picker" data-note="Declarative: a select[data-ms=font] is auto-populated from MS.fonts (auto = style default). Persisted with body[data-ms-persist].">
  <label>Font <select data-ms="font"></select></label>
  <p>The quick brown fox jumps over the lazy dog. 0123456789</p>
  </template>
  <template class="example" data-title="MS.set / MS.get" data-note="Keys are case-insensitive: 'Inter', 'open-sans'. Any CSS font-family string also works. 'auto' removes the override. ms:change detail includes font.">
  <div role="group">
    <button type="button" onclick="MS.set({ font: 'Inter' })">Inter</button>
    <button type="button" onclick="MS.set({ font: 'Playfair Display' })">Playfair</button>
    <button type="button" onclick="MS.set({ font: 'JetBrains Mono' })">JetBrains Mono</button>
    <button type="button" onclick="MS.set({ font: 'Georgia, serif' })">Georgia (CSS)</button>
    <button type="button" class="outline" onclick="MS.set({ font: 'auto' })">auto</button>
  </div>
  <pre><code class="language-javascript">MS.fonts;               // ['auto','system','inter','roboto', ...]
MS.set({ font: 'inter' });
MS.get().font;          // 'inter'
MS.set({ font: 'auto' }, el); // scoped: sets --ms-font on el only</code></pre>
  </template>
</section>

<section role="tabpanel" id="c-buttons" data-title="Buttons" data-desc="button, input[type=submit] and [role=button] share one look; classes add variants and sizes.">
  <template class="example" data-title="Basic buttons" data-note="Classless. aria-busy=true shows a spinner; disabled is native.">
    <button>Button</button>
    <button disabled>Disabled</button>
    <input type="submit" value="Submit">
    <a href="#c-buttons" role="button">Link button</a>
    <button aria-busy="true">Loading</button>
  </template>
  <template class="example" data-title="Variants and sizes" data-note='Opt-in classes. Variants combine: class="outline secondary". Sizes: sm, lg, icon, fab.'>
    <button>Primary</button>
    <button class="secondary">Secondary</button>
    <button class="outline">Outline</button>
    <button class="ghost">Ghost</button>
    <button class="contrast">Contrast</button>
    <button class="success">Success</button>
    <button class="warning">Warning</button>
    <button class="error">Error</button>
    <button class="outline secondary">Outline secondary</button>
    <hr>
    <button class="sm">Small</button>
    <button>Medium</button>
    <button class="lg">Large</button>
    <button class="icon" aria-label="Add">+</button>
    <button class="fab" aria-label="Add">+</button>
  </template>
  <template class="example" data-title="Tonal and info buttons" data-note="Opt-in .tonal (soft fill) and .info status colour; both combine with .secondary, .success, .warning, .error, .sm, .lg.">
    <button class="tonal">Tonal</button>
    <button class="tonal secondary">Tonal secondary</button>
    <button class="tonal error">Tonal error</button>
    <button class="info">Info</button>
    <button class="tonal info">Tonal info</button>
    <button class="tonal sm" disabled>Disabled</button>
  </template>
</section>

<section role="tabpanel" id="c-icons" data-title="Icons" data-desc="Material Symbols Outlined ligature icons, loaded on demand." data-net="1">
  <template class="example" data-title="Icons" data-note='span.ms-icon with the ligature name. The font loads from Google Fonts only when a .ms-icon exists; ligature text is hidden until ready. Opt out / self-host: body data-ms-icons="off". Add .filled for the solid style. Without the font (offline) icons stay blank, so keep aria-hidden and a text label or aria-label.'>
    <button><span class="ms-icon" aria-hidden="true">star</span> Favourite</button>
    <button class="tonal"><span class="ms-icon filled" aria-hidden="true">favorite</span> Like</button>
    <button class="icon outline" aria-label="Settings"><span class="ms-icon" aria-hidden="true">settings</span></button>
    <button class="fab" aria-label="Add"><span class="ms-icon" aria-hidden="true">add</span></button>
    <span class="chip"><span class="ms-icon" aria-hidden="true">sell</span> Tag</span>
    <span class="badge"><span class="ms-icon" aria-hidden="true">bolt</span> New</span>
  </template>
  <template class="example" data-title="Icon in an input" data-note="Put the icon before the input inside its label.">
    <label>Search <span class="ms-icon" aria-hidden="true">search</span><input type="search" placeholder="Search"></label>
  </template>
</section>

<section role="tabpanel" id="c-inputs" data-title="Inputs" data-desc="All text-like input types, styled without classes.">
  <template class="example" data-title="Input types" data-note="Classless. Wrap in a label; use small for helper text.">
    <div class="cols">
      <label>Text <input type="text" placeholder="Text"></label>
      <label>Email <input type="email" placeholder="you@x.com"></label>
      <label>Password <input type="password" value="secret"></label>
      <label>Number <input type="number" value="3"></label>
      <label>Search <input type="search" placeholder="Search"></label>
      <label>URL <input type="url" placeholder="https://"></label>
      <label>Tel <input type="tel" placeholder="+1 555"></label>
      <label>Date <input type="date"></label>
      <label>Time <input type="time"></label>
      <label>Datetime <input type="datetime-local"></label>
      <label>Month <input type="month"></label>
      <label>Colour <input type="color" value="#2060df"></label>
      <label>File <input type="file"></label>
    </div>
  </template>
  <template class="example" data-title="Icons and affixes" data-note='The label.field wrapper takes the input look (border, radius, focus ring); inner input is borderless. Slots: .ms-icon, .affix, button.ghost.icon.'>
    <label class="field"><span class="ms-icon">search</span><input type="search" placeholder="Search" aria-label="Search"><button type="button" class="ghost icon" aria-label="Clear">×</button></label>
    <label class="field"><span class="affix">https://</span><input placeholder="example" aria-label="Domain"><span class="affix">.com</span></label>
  </template>
</section>

<section role="tabpanel" id="c-floating" data-title="Floating label" data-desc="Label floats up on focus or when filled (CSS only)">
  <template class="example" data-title="Automatic (no classes)" data-note="In material and material3 (and with no style class at all) plain labels float by themselves: wrap the field in a label, or put label[for] right before it. Switch the style in the top bar: every other style keeps the normal stacked label. date/time fields and selects are always floated; checkboxes, radios, range, colour and file inputs never. A label with several controls is left alone. forms.js adds placeholder=' ' to fields that have none (no JS: the label just stays floated).">
    <label>Email <input type="email"></label>
    <label>Required <input type="text" required></label>
    <label>Message <textarea rows="3"></textarea></label>
    <label>Plan <select><option value="">Choose</option><option>Free</option><option>Pro</option></select></label>
    <label>Birthday <input type="date"></label>
    <label for="af-b">Sibling (label for, right before the field)</label>
    <input id="af-b" type="text">
    <label><span class="ms-icon">mail</span>With icon <input type="email"><small>Helper text inside the label</small></label>
    <label><input type="checkbox"> A checkbox label is untouched</label>
  </template>
  <template class="example" data-title="data-ms-fields" data-note='data-ms-fields on any ancestor (nearest wins): stacked turns floating off (material scopes), floating = the active style&apos;s natural variant (outlined in material3, filled elsewhere), filled / outlined force a variant in ANY style. Limits: the attribute is read when the page renders and fields are scanned (JS placeholder sync runs on load, added nodes and ms:change); needs @container style() queries (Chromium, Safari, current Firefox).'>
    <div data-ms-fields="stacked"><label>Stacked (off) <input type="text"></label></div>
    <div data-ms-fields="floating"><label>Floating (natural) <input type="text"></label></div>
    <div data-ms-fields="filled"><label>Filled <input type="text"></label></div>
    <div data-ms-fields="outlined"><label>Outlined <input type="text"></label></div>
  </template>
  <template class="example" data-title="Floating labels" data-note='label.floating > input|textarea|select + span. The input needs placeholder=" " (a single space). The visual follows the active style: filled (Material 2) in material / default, outlined with a notched label (Material 3) in material3, the classic floating look elsewhere. Selects float once an option with a value is chosen.'>
    <label class="floating"><input type="email" placeholder=" "><span>Email</span></label>
    <label class="floating"><textarea placeholder=" "></textarea><span>Message</span></label>
    <label class="floating"><select><option value="">Choose</option><option>Free</option><option>Pro</option></select><span>Plan</span></label>
  </template>
  <template class="example" data-title="Filled and outlined" data-note='Add .filled or .outlined to label.floating to force a Material variant in any style (default: filled in material, outlined in material3). The outlined notch uses --ms-field-bg (surface; cards and popovers set it automatically). The visual follows the active style otherwise.'>
    <label class="floating filled"><input type="text" placeholder=" "><span>Filled</span></label>
    <label class="floating outlined"><input type="text" placeholder=" "><span>Outlined</span></label>
  </template>
  <template class="example" data-title="Leading and trailing icons" data-note='A .ms-icon as first child is the leading icon; an .ms-icon or button.ghost.icon after the span is trailing. The visual follows the active style.'>
    <label class="floating"><span class="ms-icon">mail</span><input type="email" placeholder=" "><span>Email</span></label>
    <label class="floating"><input type="password" placeholder=" "><span>Password</span><button type="button" class="ghost icon" aria-label="Show password"><span class="ms-icon">visibility</span></button></label>
    <label class="floating outlined"><span class="ms-icon">search</span><input type="search" placeholder=" "><span>Search</span><span class="ms-icon">tune</span></label>
  </template>
  <template class="example" data-title="Helper text and counter" data-note='Put small after the label for helper text. data-ms-counter on a maxlength field adds small.counter, right-aligned on the same line. The visual follows the active style.'>
    <label class="floating"><textarea maxlength="40" data-ms-counter placeholder=" "></textarea><span>Bio</span></label>
    <small>Tell us a little about you</small>
    <label class="floating outlined"><textarea maxlength="60" data-ms-counter placeholder=" "></textarea><span>Notes</span></label>
    <small>Letters and digits only</small>
  </template>
  <template class="example" data-title="Error and disabled" data-note='aria-invalid="true" or :user-invalid colours the indicator, label and helper with the error token; disabled dims the field. The visual follows the active style.'>
    <label class="floating"><input type="email" value="nope" aria-invalid="true" placeholder=" "><span>Email</span></label>
    <small>Enter a valid address</small>
    <label class="floating"><input type="text" value="Read only value" disabled placeholder=" "><span>Disabled</span></label>
  </template>
</section>

<section role="tabpanel" id="c-checkbox-radio" data-title="Checkbox & Radio" data-desc="Native checkboxes and radios, restyled.">
  <template class="example" data-title="Checkbox and radio" data-note="Classless. Put the input inside its label for an implicit association.">
    <fieldset>
      <label><input type="checkbox" checked> Checkbox</label>
      <label><input type="checkbox"> Unchecked</label>
      <label><input type="radio" name="r1" checked> Radio A</label>
      <label><input type="radio" name="r1"> Radio B</label>
    </fieldset>
  </template>
  <template class="example" data-title="Sizes and indeterminate" data-note='.sm / .lg scale the control. Indeterminate is set from JS: el.indeterminate = true.'>
    <label><input type="checkbox" class="sm"> Small</label>
    <label><input type="checkbox" checked> Default</label>
    <label><input type="checkbox" class="lg" checked> Large</label>
    <label><input type="checkbox" id="ex-ind"> Indeterminate</label>
    <label><input type="radio" name="ex-r" class="lg" checked> Radio</label>
    <label><input type="checkbox" role="switch" checked> Switch</label>
    <script>document.getElementById('ex-ind').indeterminate = true;</script>
  </template>
</section>

<section role="tabpanel" id="c-switch" data-title="Switch" data-desc="A checkbox with role=switch becomes a toggle.">
  <template class="example" data-title="Switch" data-note="Classless. role=switch is announced as on/off by screen readers.">
    <label><input type="checkbox" role="switch" checked> Notifications</label>
    <label><input type="checkbox" role="switch"> Dark sidebar</label>
  </template>
</section>

<section role="tabpanel" id="c-range" data-title="Range" data-desc="Slider input.">
  <template class="example" data-title="Range" data-note="Classless. Give it a visible label or aria-label.">
    <label>Volume <input type="range" min="0" max="100" value="40"></label>
  </template>
</section>

<section role="tabpanel" id="c-select" data-title="Select" data-desc="Single and multiple select.">
  <template class="example" data-title="Select" data-note="Classless.">
    <label>Select
      <select><option>One</option><option>Two</option><option>Three</option></select>
    </label>
    <label>Multiple <select multiple><option>One</option><option selected>Two</option><option>Three</option></select></label>
  </template>
  <template class="example" data-title="Custom select" data-note='class="custom" opts in to appearance: base-select (Chromium 135+); other browsers keep the native select unchanged.'>
    <select class="custom" aria-label="Fruit"><option>Apple</option><option>Banana</option><option>Cherry</option><option disabled>Durian (sold out)</option></select>
  </template>
</section>

<section role="tabpanel" id="c-multiselect" data-title="Multi-select" data-desc="Chips, filter and listbox over a real select multiple">
  <template class="example" data-title="Multi-select" data-note='select[multiple][data-ms-multiselect] stays in the form as the source of truth and fires change (works with Alpine x-model). Keys: Up/Down/Enter/Escape, Backspace removes the last chip. MS.multiselect(el) inits manually.'>
    <label>Skills
      <select name="skills" multiple data-ms-multiselect data-placeholder="Pick skills…">
        <option value="js">JavaScript</option><option value="css" selected>CSS</option><option value="html">HTML</option><option value="py">Python</option>
      </select>
    </label>
  </template>
</section>

<section role="tabpanel" id="c-textarea" data-title="Textarea" data-desc="Multi-line text input.">
  <template class="example" data-title="Textarea" data-note="Classless.">
    <label>Message <textarea rows="3" placeholder="Write something"></textarea></label>
  </template>
  <template class="example" data-title="Autoresize and counter" data-note='.autoresize uses field-sizing: content (Chromium/Safari 26); bound rows with style="--min-rows:2;--max-rows:8". data-ms-counter + maxlength appends small.counter (aria-live).'>
    <textarea class="autoresize" style="--min-rows:2;--max-rows:8" maxlength="200" data-ms-counter placeholder="Type here, it grows"></textarea>
  </template>
</section>

<section role="tabpanel" id="c-fieldset" data-title="Fieldset & Validation" data-desc="Group fields with fieldset and flag state with aria-invalid.">
  <template class="example" data-title="Fieldset" data-note="Classless. legend labels the group for assistive tech.">
    <fieldset>
      <legend>Plan</legend>
      <label><input type="radio" name="plan" checked> Free</label>
      <label><input type="radio" name="plan"> Pro</label>
    </fieldset>
  </template>
  <template class="example" data-title="Validation" data-note="Use aria-invalid=true/false plus a small element for the message.">
    <label>Valid <input value="ok@x.com" aria-invalid="false"><small>Looks good.</small></label>
    <label>Invalid <input value="nope" aria-invalid="true"><small>Enter a valid email.</small></label>
    <label>Required <input type="email" required placeholder="Type then clear"></label>
  </template>
</section>

<section role="tabpanel" id="c-group" data-title="Group" data-desc="role=group joins buttons, or an input and a button, into one control.">
  <template class="example" data-title="Button group and input group" data-note="Classless. Add aria-label on the group when there is no visible label.">
    <div role="group"><button>One</button><button>Two</button><button>Three</button></div>
    <form role="group" onsubmit="return false"><input type="email" placeholder="Email" aria-label="Email"><input type="submit" value="Subscribe"></form>
  </template>
  <template class="example" data-title="Single select" data-note="role=group + data-ms-select=single|multi toggles aria-pressed; fires ms:select {values}.">
    <div role="group" data-ms-select="single" aria-label="View">
      <button class="outline" aria-pressed="true">Day</button><button class="outline">Week</button><button class="outline">Month</button>
    </div>
  </template>
  <template class="example" data-title="Multi select, vertical" data-note="aria-orientation=vertical stacks the group.">
    <div role="group" data-ms-select="multi" aria-orientation="vertical" aria-label="Format">
      <button class="outline">Bold</button><button class="outline">Italic</button><button class="outline">Underline</button>
    </div>
  </template>
</section>

<section role="tabpanel" id="c-table" data-title="Table" data-desc="Plain tables; add striped for zebra rows.">
  <template class="example" data-title="Striped table" data-note="Classless; class=striped is optional. Wrap in an overflow-x:auto div on small screens.">
    <div class="table-wrap">
    <table class="striped">
      <thead><tr><th>Name</th><th>Role</th><th>Score</th></tr></thead>
      <tbody>
        <tr><td>Ada</td><td>Engineer</td><td>98</td></tr>
        <tr><td>Linus</td><td>Maintainer</td><td>91</td></tr>
        <tr><td>Grace</td><td>Admiral</td><td>99</td></tr>
      </tbody>
    </table>
    </div>
  </template>
  <template class="example" data-title="Sticky header, compact, hover" data-note="Wrap in .table-wrap (scrolls, height via --ms-table-h, default 22rem) and add .sticky to pin the header. .compact tightens cells, .hover highlights rows.">
    <div class="table-wrap" style="--ms-table-h:10rem">
      <table class="sticky compact hover">
        <thead><tr><th>#</th><th>Name</th><th>Role</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>Ada</td><td>Admin</td></tr><tr><td>2</td><td>Linus</td><td>Dev</td></tr>
          <tr><td>3</td><td>Grace</td><td>Dev</td></tr><tr><td>4</td><td>Alan</td><td>QA</td></tr>
          <tr><td>5</td><td>Edsger</td><td>Dev</td></tr><tr><td>6</td><td>Barbara</td><td>PM</td></tr>
        </tbody>
      </table>
    </div>
  </template>
</section>

<section role="tabpanel" id="c-accordion" data-title="Accordion" data-desc="details and summary, no JavaScript.">
  <template class="example" data-title="Exclusive accordion" data-note="Classless. The same name attribute makes the group exclusive, natively. Keyboard and a11y come from details.">
    <details name="acc" open><summary>First</summary><p>Opens by default.</p></details>
    <details name="acc"><summary>Second</summary><p>Opening this closes the first.</p></details>
    <details name="acc"><summary>Third</summary><p>No JavaScript.</p></details>
  </template>
</section>

<section role="tabpanel" id="c-modal" data-title="Modal" data-desc="A native dialog with focus trap and Esc built in.">
  <template class="example" data-title="Modal with header close and form footer" data-note='Classless dialog > article. Open: data-ms-open="#id". Close: empty button rel=prev (renders ×), data-ms-close, or form method=dialog buttons.'>
    <button data-ms-open="#dlg1">Open modal</button>
    <dialog id="dlg1" aria-labelledby="dlg1-t">
      <article>
        <header><button rel="prev" aria-label="Close"></button><h3 id="dlg1-t">Confirm</h3></header>
        <p>Dialogs use the native element: focus trap and Esc come free.</p>
        <form method="dialog">
          <footer><button value="cancel" class="secondary">Cancel</button><button value="ok">OK</button></footer>
        </form>
      </article>
    </dialog>
  </template>
  <template class="example" data-title="data-ms-close and MS.open" data-note="data-ms-close closes its dialog; MS.open(sel)/MS.close(sel) work from JS.">
    <button onclick="MS.open('#dlg2')">MS.open('#dlg2')</button>
    <dialog id="dlg2" aria-labelledby="dlg2-t">
      <article>
        <header><button data-ms-close aria-label="Close"></button><h3 id="dlg2-t">Opened from JS</h3></header>
        <p>Click the × or the button below.</p>
        <footer><button data-ms-close>Close</button></footer>
      </article>
    </dialog>
  </template>
  <template class="example" data-title="Modal sizes" data-note="data-size=sm|md|lg|full on the dialog (md is the default).">
    <button class="sm" data-ms-open="#dlg-sm">Small</button>
    <button class="sm" data-ms-open="#dlg-lg">Large</button>
    <button class="sm" data-ms-open="#dlg-full">Full screen</button>

      <div class="chart"><canvas data-ms-chart="pie" data-ms-chart-data='{"labels":["A","B","C"],"datasets":[{"data":[30,50,20]}]}' aria-label="pie chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="doughnut" data-note="Declarative: data-ms-chart=&quot;doughnut&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="doughnut" data-ms-chart-data='{"labels":["A","B","C"],"datasets":[{"data":[30,50,20]}]}' aria-label="doughnut chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="radar" data-note="Declarative: data-ms-chart=&quot;radar&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="radar" data-ms-chart-data='{"labels":["Speed","Power","Range","Cost","Comfort"],"datasets":[{"label":"Model A","data":[8,6,7,4,9]},{"label":"Model B","data":[5,9,4,7,6]}]}' aria-label="radar chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="polarArea" data-note="Declarative: data-ms-chart=&quot;polarArea&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="polarArea" data-ms-chart-data='{"labels":["A","B","C","D"],"datasets":[{"data":[11,16,7,14]}]}' aria-label="polarArea chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="scatter" data-note="Declarative: data-ms-chart=&quot;scatter&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="scatter" data-ms-chart-data='{"datasets":[{"label":"Points","data":[{"x":1,"y":2},{"x":2,"y":5},{"x":3,"y":3},{"x":4,"y":7}]}]}' aria-label="scatter chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="bubble" data-note="Declarative: data-ms-chart=&quot;bubble&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="bubble" data-ms-chart-data='{"datasets":[{"label":"Bubbles","data":[{"x":1,"y":2,"r":6},{"x":2,"y":5,"r":12},{"x":3,"y":3,"r":8},{"x":4,"y":7,"r":15}]}]}' aria-label="bubble chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="stacked-bar" data-note="Declarative: data-ms-chart=&quot;stacked-bar&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="stacked-bar" data-ms-chart-data='{"labels":["Jan","Feb","Mar","Apr"],"datasets":[{"label":"A","data":[4,6,5,8]},{"label":"B","data":[3,2,6,4]}]}' aria-label="stacked-bar chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="stacked-line" data-note="Declarative: data-ms-chart=&quot;stacked-line&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="stacked-line" data-ms-chart-data='{"labels":["Jan","Feb","Mar","Apr"],"datasets":[{"label":"A","data":[4,6,5,8]},{"label":"B","data":[3,2,6,4]}]}' aria-label="stacked-line chart" role="img"></canvas></div>
    </template>
    <template class="example" data-title="combo" data-note="Declarative: data-ms-chart=&quot;combo&quot; + JSON in data-ms-chart-data. Colors come from the active theme and re-theme on ms:change.">
      <div class="chart"><canvas data-ms-chart="combo" data-ms-chart-data='{"labels":["Jan","Feb","Mar","Apr"],"datasets":[{"label":"Bars","data":[12,19,8,15]},{"label":"Line","data":[10,14,11,17]}]}' aria-label="combo chart" role="img"></canvas></div>
    </template>
  <template class="example" data-title="Programmatic: MS.chart()" data-note="MS.chart(canvasOrSelector, chartJsConfig) returns the Chart instance (or null if Chart.js is missing).">
    <div class="chart" style="--ms-chart-h:220px"><canvas x-data x-init="MS.chart($el, {type:'bar', data:{labels:['A','B','C'], datasets:[{label:'Programmatic', data:[3,7,4]}]}})" aria-label="programmatic chart" role="img"></canvas></div>
  </template>
</section>

<section role="tabpanel" id="c-mermaid" data-title="Mermaid" data-desc="Diagrams from text, themed to the active tokens and re-rendered on theme change." data-net="1">
  <template class="example" data-preview="off" data-title="Add this script tag" data-note="Requires network (CDN). Load it after multistyle; all scripts can be defer. Then any pre.mermaid is rendered automatically.">
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  </template>
  <template class="example" data-title="Flowchart" data-note="Markup API: pre.mermaid with the diagram source as text. MS.mermaid(el?) re-renders.">
    <pre class="mermaid">
graph TD
  A[Start] --> B{Ready?}
  B -->|Yes| C[Ship it]
  B -->|No| D[Fix]
  D --> B
    </pre>
  </template>
  <template class="example" data-title="Sequence diagram" data-note="Same markup, different diagram type.">
    <pre class="mermaid">
sequenceDiagram
  participant U as User
  participant A as App
  U->>A: Click save
  A-->>U: Toast: Saved
    </pre>
  </template>
  <template class="example" data-title="State diagram" data-note="Same markup.">
    <pre class="mermaid">
stateDiagram-v2
  [*] --> Idle
  Idle --> Loading: fetch
  Loading --> Done: ok
  Loading --> Error: fail
  Error --> Idle: retry
  Done --> [*]
    </pre>
  </template>
  <template class="example" data-title="Pie chart" data-note="Same markup.">
    <pre class="mermaid">
pie title Pets
  "Dogs" : 40
  "Cats" : 35
  "Fish" : 25
    </pre>
  </template>
</section>

<section role="tabpanel" id="c-editor" data-title="Text editor" data-desc="Rich text editing with Quill, themed to the active tokens." data-net="1">
  <template class="example" data-preview="off" data-title="Add these tags" data-note="Requires network (CDN). Stylesheet in head, script after multistyle (defer).">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
    <script defer src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  </template>
  <template class="example" data-title="Basic editor" data-note="div[data-ms-editor] auto-initialises. MS.editor(el, quillOptions) returns the Quill instance (also el.msEditor). data-toolbar=minimal|full.">
    <div data-ms-editor data-placeholder="Write something…"></div>
  </template>
  <template class="example" data-title="Minimal toolbar in a form" data-note="data-name syncs a hidden input, so the editor submits like any field. Submit shows its value in a toast.">
    <form onsubmit="event.preventDefault(); MS.toast('body = ' + new FormData(this).get('body'), {type:'success'})">
      <div data-ms-editor data-toolbar="minimal" data-name="body" data-placeholder="Write a note…"></div>
      <button type="submit">Submit</button>
    </form>
  </template>
  <template class="example" data-title="Alpine: read the content" data-note="Poll for el.msEditor (the CDN script loads async), then listen to Quill's text-change.">
    <div x-data="{ html: '' }" x-init="const t = setInterval(() => { const q = $refs.ed.msEditor; if (q) { q.on('text-change', () => html = q.root.innerHTML); clearInterval(t); } }, 100)">
      <div x-ref="ed" data-ms-editor data-placeholder="Type here…"></div>
      <p>HTML: <code x-text="html"></code></p>
    </div>
  </template>
</section>

<section role="tabpanel" id="c-code" data-title="Code" data-desc="Prism syntax highlighting (CDN bridge) and a textarea code editor" data-net="1">
  <template class="example" data-title="Load Prism from a CDN" data-note="multistyle-ui never bundles Prism. Load core + the autoloader (languages such as js, ts, html, css, json, bash, python, svelte are fetched on demand). No Prism theme CSS: tokens are themed by multistyle-ui.">
  <pre><code class="language-html">&lt;script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js"&gt;&lt;/script&gt;
&lt;script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"&gt;&lt;/script&gt;
&lt;script src="multistyle.min.js"&gt;&lt;/script&gt;</code></pre>
  </template>
  <template class="example" data-title="Highlighted block" data-note="Read-only: pre &gt; code with a language-* class. Highlighted on load and for nodes added later.">
  <pre><code class="language-javascript">// themed by the active style, theme and mode
export function greet(name = "world") {
  return `Hello, ${name}!`;
}</code></pre>
  <pre><code class="language-css">.card { color: var(--ms-c-primary); padding: 1rem; }</code></pre>
  <pre><code class="language-bash">npm install multistyle-ui &amp;&amp; npm run build</code></pre>
  </template>
  <template class="example" data-title="Code editor" data-note="textarea[data-ms-code=lang]: still the form field (name, value). Tab inserts 2 spaces, Shift+Tab outdents, Esc then Tab moves focus away. Works without Prism (no colors).">
  <textarea data-ms-code="javascript" name="snippet" rows="6">const total = items
    .filter((i) => i.active)
    .reduce((sum, i) => sum + i.price, 0);</textarea>
  </template>
  <template class="example" data-title="Line numbers" data-note="Add data-ms-lines.">
  <textarea data-ms-code="json" data-ms-lines rows="6" spellcheck="false">{
    "name": "multistyle-ui",
    "styles": 12,
    "themes": 30
  }</textarea>
  </template>
  <template class="example" data-title="Read-only editor" data-note="The readonly attribute is honoured (Tab moves focus).">
  <textarea data-ms-code="html" data-ms-lines readonly rows="4">&lt;button class="outline"&gt;Save&lt;/button&gt;</textarea>
  </template>
  <template class="example" data-title="In a form" data-note="The textarea posts as usual; reset restores the original text.">
  <form onsubmit="event.preventDefault(); this.querySelector('output').textContent = new FormData(this).get('src');">
    <label>Script
      <textarea data-ms-code="python" name="src" rows="5">def add(a, b):
      return a + b</textarea>
    </label>
    <div role="group"><button type="submit">Submit</button><button type="reset" class="secondary">Reset</button></div>
    <pre><output>(submitted value appears here)</output></pre>
  </form>
  </template>
  <template class="example" data-title="Manual init" data-note="MS.code(el, {language, lines}) returns {el, update(), destroy()}. Call update() after setting .value in script.">
  <textarea id="code-manual" rows="4">SELECT * FROM users WHERE active = true;</textarea>
  <button type="button" onclick="(window.__c ||= MS.code('#code-manual', { language: 'sql', lines: true })).update()">Init / refresh</button>
  </template>
</section>

  </div>
</section>
</main>
</div>
</div>
</body>
</html>
